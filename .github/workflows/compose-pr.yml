name: Compose PR

on:
  pull_request:
    branches:
      - staging2
    paths:
      - "compose/**"
      - "core/**"
      - "buildSrc/**"
      - "gradle/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - ".github/workflows/compose-pr.yml"

permissions:
  contents: read

jobs:
  common-and-android-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_head_sha="$(git rev-parse HEAD)"
          echo "expected_head_sha=${EXPECTED_HEAD_SHA}"
          echo "actual_head_sha=${actual_head_sha}"
          test "${actual_head_sha}" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile common metadata and run Android JVM tests
        run: >-
          ./gradlew
          :compose:compileCommonMainKotlinMetadata
          :compose:testDebugUnitTest
          --no-daemon

      - name: Report Android JVM test count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("compose/build/test-results").glob("**/TEST-*.xml"))
          if not reports:
              raise SystemExit("No Android JVM test result XML files found")

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, "0"))

          print(
              "android_jvm_test_count "
              + " ".join(f"{key}={value}" for key, value in totals.items())
          )
          if totals["tests"] == 0 or totals["failures"] or totals["errors"]:
              raise SystemExit(1)
          PY
