name: Demo Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build the demo APK from"
        required: true
        default: "staging4"
        type: string
      variant:
        description: "Gradle assemble task suffix (Debug or Release)"
        required: false
        default: "Debug"
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build-demo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build demo APK
        run: ./gradlew :androidApp:assemble${{ inputs.variant }} --no-daemon

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: demo-apk-${{ inputs.variant }}-${{ github.sha }}
          path: androidApp/build/outputs/apk/**/*.apk
          retention-days: 30
