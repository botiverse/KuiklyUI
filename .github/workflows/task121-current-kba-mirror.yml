name: Task121 Current KBA Maven Mirror

on:
  pull_request:
    paths:
      - .github/workflows/task121-current-kba-mirror.yml
      - publish/predecessors/task121-current-kba-manifest.tsv
      - tools/raft-artifacts/mirror_maven_manifest.py
      - tools/raft-artifacts/test_mirror_maven_manifest.py
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source SHA to verify and publish
        required: true
        type: string
      publish:
        description: Publish missing exact bytes after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: task121-current-kba-${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
  cancel-in-progress: false

env:
  MANIFEST: publish/predecessors/task121-current-kba-manifest.tsv
  TARGET_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the exact source
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check HEAD^
      - name: Verify the narrowed authority bytes and destination state
        run: |
          python3 tools/raft-artifacts/test_mirror_maven_manifest.py
          python3 tools/raft-artifacts/mirror_maven_manifest.py \
            --manifest "$MANIFEST" \
            --mode plan

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: raft-artifacts-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind the exact source and require the repository publisher
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/staging3 | cut -f1)" = "$TARGET_SHA"
      - name: Publish with standard immutable Maven PUT semantics
        env:
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
        run: |
          test -n "$RAFT_ARTIFACTS_PUBLISH_TOKEN"
          python3 tools/raft-artifacts/mirror_maven_manifest.py \
            --manifest "$MANIFEST" \
            --mode publish
